<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Region Growing Partitioner</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:       #0d1117;
  --surf:     #161b22;
  --surf2:    #1c2430;
  --border:   #30363d;
  --border2:  #21262d;
  --accent:   #58a6ff;
  --green:    #3fb950;
  --orange:   #d29922;
  --red:      #f85149;
  --text:     #e6edf3;
  --muted:    #8b949e;
  --muted2:   #484f58;
  --mono:     'IBM Plex Mono', monospace;
  --sans:     'IBM Plex Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0 1.5rem;
  height: 48px;
  border-bottom: 1px solid var(--border);
  background: var(--surf);
  flex-shrink: 0;
}
.logo {
  font-family: var(--sans);
  font-weight: 700;
  font-size: 0.95rem;
  letter-spacing: -0.01em;
  color: var(--text);
  display: flex; align-items: center; gap: 0.5rem;
}
.logo-badge {
  background: var(--green);
  color: #000;
  font-family: var(--mono);
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  padding: 2px 6px;
  border-radius: 3px;
  text-transform: uppercase;
}
.header-sep { width: 1px; height: 20px; background: var(--border); }
.header-desc {
  font-size: 0.7rem;
  color: var(--muted);
  letter-spacing: 0.04em;
}

/* ── Main layout ── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  width: 320px;
  flex-shrink: 0;
  background: var(--surf);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sb-section {
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--border2);
}
.sb-label {
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.55rem;
  display: flex; align-items: center; gap: 0.4rem;
}
.sb-label::before {
  content: '';
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--muted2);
}

textarea#yaml-input {
  width: 100%;
  height: 220px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 0.73rem;
  line-height: 1.7;
  padding: 0.75rem;
  resize: vertical;
  outline: none;
  transition: border-color 0.15s;
}
textarea#yaml-input:focus { border-color: var(--accent); }

/* param rows */
.param-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0.6rem;
  margin-bottom: 0.75rem;
}
.param-item { display: flex; flex-direction: column; gap: 0.3rem; }
.param-item label {
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
input[type=number] {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 5px;
  font-family: var(--mono);
  font-size: 0.85rem;
  padding: 0.45rem 0.6rem;
  width: 100%;
  outline: none;
  transition: border-color 0.15s;
}
input[type=number]:focus { border-color: var(--accent); }

.btn-run {
  width: 100%;
  background: var(--green);
  color: #000;
  border: none;
  border-radius: 6px;
  font-family: var(--sans);
  font-weight: 700;
  font-size: 0.88rem;
  letter-spacing: 0.03em;
  padding: 0.65rem;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
}
.btn-run:hover { opacity: 0.88; }
.btn-run:active { transform: scale(0.98); }
.btn-run:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

/* error */
#error-box {
  display: none;
  margin: 0.5rem 1.25rem;
  background: rgba(248,81,73,0.1);
  border: 1px solid rgba(248,81,73,0.4);
  border-radius: 5px;
  padding: 0.6rem 0.85rem;
  color: var(--red);
  font-size: 0.74rem;
  line-height: 1.5;
}

/* stats */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border-bottom: 1px solid var(--border2);
}
.stat-cell {
  padding: 0.7rem 1rem;
  border-right: 1px solid var(--border2);
}
.stat-cell:last-child { border-right: none; }
.stat-val {
  font-family: var(--sans);
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1;
}
.stat-lbl {
  font-size: 0.58rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 0.25rem;
}

/* legend */
.legend-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 0.85rem 1.25rem;
}
.legend-title {
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.65rem;
}
.part-row {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.45rem 0.6rem;
  border-radius: 5px;
  margin-bottom: 0.3rem;
  background: var(--surf2);
  border: 1px solid var(--border2);
  transition: border-color 0.15s;
}
.part-row:hover { border-color: var(--border); }
.part-swatch {
  width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0;
}
.part-name {
  font-size: 0.8rem; font-weight: 600; min-width: 28px;
}
.part-count {
  font-size: 0.7rem; color: var(--muted);
  margin-left: auto; flex-shrink: 0;
}
.part-conn {
  font-size: 0.62rem;
  padding: 1px 5px;
  border-radius: 3px;
  flex-shrink: 0;
}
.part-conn.ok  { background: rgba(63,185,80,0.15); color: var(--green); }
.part-conn.bad { background: rgba(248,81,73,0.15); color: var(--red); }
.part-nodes {
  font-size: 0.68rem;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1; min-width: 0;
}

/* export */
.export-wrap {
  padding: 0.85rem 1.25rem;
  border-top: 1px solid var(--border2);
}
.export-title {
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.55rem;
}
.export-btns { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.btn-dl {
  background: var(--surf2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 5px;
  font-family: var(--mono);
  font-size: 0.7rem;
  padding: 0.35rem 0.7rem;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
  display: flex; align-items: center; gap: 0.35rem;
}
.btn-dl:hover { background: var(--border); border-color: var(--accent); }
.btn-dl .swatch {
  width: 8px; height: 8px; border-radius: 2px;
}

/* scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── Canvas ── */
.canvas-area {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: var(--bg);
}

/* subtle grid background */
.canvas-area::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(48,54,61,0.35) 1px, transparent 1px),
    linear-gradient(90deg, rgba(48,54,61,0.35) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

canvas {
  display: block;
  width: 100%; height: 100%;
  cursor: grab;
}
canvas:active { cursor: grabbing; }

/* HUD */
.hud {
  position: absolute;
  top: 12px; left: 14px;
  display: flex; gap: 0.5rem; align-items: center;
  pointer-events: none;
}
.hud-chip {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 3px 9px;
  font-size: 0.63rem;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.hud-chip.active { color: var(--green); border-color: rgba(63,185,80,0.4); }

/* Tooltip */
#tooltip {
  position: absolute;
  pointer-events: none;
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.5rem 0.75rem;
  font-size: 0.72rem;
  line-height: 1.7;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  display: none; z-index: 20;
  min-width: 140px;
}
.tt-id   { font-weight: 600; font-size: 0.82rem; }
.tt-part { color: var(--muted); }
.tt-xy   { color: var(--muted2); font-size: 0.67rem; }

/* hint */
.hint {
  position: absolute;
  bottom: 12px; right: 14px;
  font-size: 0.62rem;
  color: var(--muted2);
  letter-spacing: 0.05em;
  pointer-events: none;
}

/* spinner */
.spinner {
  display: none;
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 36px; height: 36px;
  border: 2px solid var(--border);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

/* BFS animation dots */
.bfs-layer {
  position: absolute; inset: 0;
  pointer-events: none;
}
</style>

<script>
// ─── Palette ───────────────────────────────────────────────────────────────
const COLORS = [
  '#58a6ff','#3fb950','#f78166','#d2a679','#bc8cff',
  '#79c0ff','#56d364','#ffa657','#ff7b72','#d2a8ff',
  '#a5d6ff','#7ee787','#ffc680','#ff9492','#e2c5ff',
  '#cae8ff','#abf2bc','#ffe0b2','#ffd0cc','#f0d9ff'
];
const SEED_RING = '#f0e68c';

// ─── YAML parser ───────────────────────────────────────────────────────────
function parseYAML(text) {
  const lines = text.split('\n');
  const r = { nodes: [], edges: [] };
  let section = null, cur = null;
  for (let raw of lines) {
    const line = raw.trimEnd();
    if (!line.trim() || line.trim().startsWith('#')) continue;
    if (/^nodes\s*:/.test(line)) { section = 'nodes'; continue; }
    if (/^edges\s*:/.test(line)) { section = 'edges'; continue; }
    const li = line.match(/^\s+-\s+(.*)/);
    if (li) {
      cur = {};
      if (section === 'nodes') r.nodes.push(cur);
      else if (section === 'edges') r.edges.push(cur);
      const kv = li[1].match(/(\w+)\s*:\s*(.+)/);
      if (kv) cur[kv[1]] = pv(kv[2].trim());
      continue;
    }
    const kv = line.match(/^\s+(\w+)\s*:\s*(.+)/);
    if (kv && cur) cur[kv[1]] = pv(kv[2].trim());
  }
  return r;
}
function pv(v) {
  if (v==='true') return true; if (v==='false') return false;
  const n = Number(v); return isNaN(n) ? v : n;
}

// ─── Region Growing algorithm ─────────────────────────────────────────────
class MinHeap {
  constructor() { this.data = []; }
  push(item) {
    this.data.push(item);
    this._up(this.data.length - 1);
  }
  pop() {
    const top = this.data[0];
    const last = this.data.pop();
    if (this.data.length) { this.data[0] = last; this._down(0); }
    return top;
  }
  get size() { return this.data.length; }
  _up(i) {
    while (i > 0) {
      const p = (i-1)>>1;
      if (this.data[p][0] <= this.data[i][0]) break;
      [this.data[p], this.data[i]] = [this.data[i], this.data[p]];
      i = p;
    }
  }
  _down(i) {
    const n = this.data.length;
    while (true) {
      let m = i, l = 2*i+1, r = 2*i+2;
      if (l < n && this.data[l][0] < this.data[m][0]) m = l;
      if (r < n && this.data[r][0] < this.data[m][0]) m = r;
      if (m === i) break;
      [this.data[m], this.data[i]] = [this.data[i], this.data[m]];
      i = m;
    }
  }
}

function dijkstraDist(adj, source, nodeIds) {
  const dist = {};
  for (const id of nodeIds) dist[id] = Infinity;
  dist[source] = 0;
  const pq = new MinHeap();
  pq.push([0, source]);
  while (pq.size) {
    const [d, u] = pq.pop();
    if (d > dist[u]) continue;
    for (const [v, w] of (adj[u] || [])) {
      const nd = d + w;
      if (nd < dist[v]) { dist[v] = nd; pq.push([nd, v]); }
    }
  }
  return dist;
}

function chooseSeeds(nodeIds, adj, k, rng) {
  if (k >= nodeIds.length) return [...nodeIds];
  const seeds = [nodeIds[Math.floor(rng() * nodeIds.length)]];
  let minDist = dijkstraDist(adj, seeds[0], nodeIds);

  for (let i = 1; i < k; i++) {
    let best = nodeIds[0], bestD = -Infinity;
    for (const n of nodeIds) {
      if ((minDist[n] || 0) > bestD) { bestD = minDist[n] || 0; best = n; }
    }
    seeds.push(best);
    const nd = dijkstraDist(adj, best, nodeIds);
    for (const n of nodeIds) minDist[n] = Math.min(minDist[n] || 0, nd[n] || 0);
  }
  return seeds;
}

function regionGrow(nodes, edges, k, balanceStrength, rng) {
  const nodeIds = nodes.map(n => n.id);
  const sizeMap = {};
  for (const n of nodes) sizeMap[n.id] = n.size || 1;
  const totalSize = Object.values(sizeMap).reduce((a,b) => a+b, 0);
  const target = totalSize / k;

  // Build adjacency
  const adj = {};
  for (const n of nodes) adj[n.id] = [];
  for (const e of edges) {
    adj[e.u] = adj[e.u] || [];
    adj[e.v] = adj[e.v] || [];
    adj[e.u].push([e.v, e.cost || 1]);
    adj[e.v].push([e.u, e.cost || 1]);
  }

  const seeds = chooseSeeds(nodeIds, adj, k, rng);
  const labels = {};
  const regSize = new Array(k).fill(0);
  const pq = new MinHeap();
  let counter = 0;

  for (let ri = 0; ri < seeds.length; ri++) {
    const s = seeds[ri];
    labels[s] = ri;
    regSize[ri] += sizeMap[s];
    for (const [nb, cost] of (adj[s] || [])) {
      if (!(nb in labels)) {
        const deficit = target - regSize[ri];
        const prio = cost - balanceStrength * deficit;
        pq.push([prio, counter++, nb, ri]);
      }
    }
  }

  while (pq.size && Object.keys(labels).length < nodeIds.length) {
    const [, , nid, ri] = pq.pop();
    if (nid in labels) continue;
    labels[nid] = ri;
    regSize[ri] += sizeMap[nid];
    for (const [nb, cost] of (adj[nid] || [])) {
      if (!(nb in labels)) {
        const deficit = target - regSize[ri];
        const prio = cost - balanceStrength * deficit;
        pq.push([prio, counter++, nb, ri]);
      }
    }
  }

  // Assign disconnected nodes
  for (const nid of nodeIds) {
    if (!(nid in labels)) {
      let bestRi = regSize.indexOf(Math.min(...regSize));
      for (const [nb] of (adj[nid] || [])) {
        if (nb in labels) { bestRi = labels[nb]; break; }
      }
      labels[nid] = bestRi;
      regSize[bestRi] += sizeMap[nid];
    }
  }

  return { labels, seeds, regSize };
}

function checkConnected(adj, labels, k) {
  const result = new Array(k).fill(true);
  const parts = {};
  for (const [id, p] of Object.entries(labels)) {
    parts[p] = parts[p] || [];
    parts[p].push(id);
  }
  for (let p = 0; p < k; p++) {
    const ns = parts[p] || [];
    if (ns.length <= 1) continue;
    const visited = new Set([ns[0]]);
    const stack = [ns[0]];
    const nset = new Set(ns);
    while (stack.length) {
      const u = stack.pop();
      for (const [v] of (adj[u] || [])) {
        if (nset.has(v) && !visited.has(v)) { visited.add(v); stack.push(v); }
      }
    }
    result[p] = visited.size === ns.length;
  }
  return result;
}

// ─── Seeded RNG (simple mulberry32) ───────────────────────────────────────
function makeRng(seed) {
  let s = seed;
  return () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ─── Canvas state ──────────────────────────────────────────────────────────
let cv, ctx;
let graphData = null, result = null;
let tfm = { x: 0, y: 0, scale: 1 };
let drag = false, dragStart = {}, tfmStart = {};
let hoveredNode = null;

function initCanvas() {
  cv = document.getElementById('cv');
  ctx = cv.getContext('2d');
  doResize();
  window.addEventListener('resize', doResize);
  cv.addEventListener('mousedown', e => {
    const r = cv.getBoundingClientRect();
    drag = true;
    dragStart = { x: e.clientX - r.left, y: e.clientY - r.top };
    tfmStart = { ...tfm };
  });
  cv.addEventListener('mousemove', onMove);
  cv.addEventListener('mouseup', () => { drag = false; });
  cv.addEventListener('mouseleave', () => {
    drag = false; hoveredNode = null;
    document.getElementById('tooltip').style.display = 'none';
    draw();
  });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const f = e.deltaY > 0 ? 0.85 : 1.18;
    const wx = (mx - tfm.x) / tfm.scale, wy = (my - tfm.y) / tfm.scale;
    tfm.scale = Math.max(0.4, Math.min(400, tfm.scale * f));
    tfm.x = mx - wx * tfm.scale;
    tfm.y = my - wy * tfm.scale;
    draw();
  }, { passive: false });
}

function doResize() {
  const dpr = window.devicePixelRatio || 1;
  const r = cv.parentElement.getBoundingClientRect();
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
  ctx.scale(dpr, dpr);
  draw();
}

function w2s(wx, wy) {
  // Negate wy so that world-Y increases upward (bottom-left origin)
  return { x: wx * tfm.scale + tfm.x, y: -wy * tfm.scale + tfm.y };
}
function s2w(sx, sy) {
  return { x: (sx - tfm.x) / tfm.scale, y: -(sy - tfm.y) / tfm.scale };
}

function fitGraph(nodes) {
  const r = cv.getBoundingClientRect();
  const pad = 90;
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const gw = x1-x0 || 1, gh = y1-y0 || 1;
  tfm.scale = Math.min((r.width-pad*2)/gw, (r.height-pad*2)/gh, 100);
  // x: left→right unchanged; y: flip so world-midY maps to screen center
  tfm.x = r.width/2  - tfm.scale*(x0+x1)/2;
  tfm.y = r.height/2 + tfm.scale*(y0+y1)/2;
}

function onMove(e) {
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  if (drag) {
    tfm.x = tfmStart.x + (mx - dragStart.x);
    tfm.y = tfmStart.y + (my - dragStart.y);
    draw(); return;
  }
  if (!graphData) return;
  const w = s2w(mx, my);
  const nr = Math.max(6, Math.min(24, tfm.scale * 0.6));
  const threshold = nr / tfm.scale * 1.5;
  const hit = graphData.nodes.find(n => {
    const dx = n.x - w.x, dy = n.y - w.y;
    return Math.sqrt(dx*dx + dy*dy) < threshold;
  }) || null;
  if (hit !== hoveredNode) { hoveredNode = hit; draw(); }
  const tip = document.getElementById('tooltip');
  if (hit) {
    const p = result ? result.labels[hit.id] : null;
    const col = p !== null ? COLORS[p % COLORS.length] : '#fff';
    document.getElementById('tt-id').textContent = `Node ${hit.id}`;
    document.getElementById('tt-id').style.color = col;
    document.getElementById('tt-part').textContent = p !== null ? `Partition P${p}` : '';
    document.getElementById('tt-xy').textContent = `x: ${hit.x.toFixed(2)}  y: ${hit.y.toFixed(2)}`;
    tip.style.display = 'block';
    tip.style.left = (mx + 16) + 'px';
    tip.style.top  = (my - 12) + 'px';
  } else {
    tip.style.display = 'none';
  }
}

// ─── Draw ──────────────────────────────────────────────────────────────────
function draw() {
  const r = cv.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  if (!graphData) {
    ctx.fillStyle = 'rgba(139,148,158,0.25)';
    ctx.font = '13px IBM Plex Mono';
    ctx.textAlign = 'center';
    ctx.fillText('Enter graph YAML and click ▶ Run Region Growing', r.width/2, r.height/2);
    return;
  }
  const { nodes, edges } = graphData;
  const labels = result ? result.labels : null;
  const seeds  = result ? new Set(result.seeds) : new Set();

  // Draw edges
  for (const e of edges) {
    const nu = nodes.find(n => n.id === e.u);
    const nv = nodes.find(n => n.id === e.v);
    if (!nu || !nv) continue;
    const pu = w2s(nu.x, nu.y), pv = w2s(nv.x, nv.y);
    const isCut = labels && labels[e.u] !== labels[e.v];

    ctx.beginPath();
    ctx.moveTo(pu.x, pu.y);
    ctx.lineTo(pv.x, pv.y);

    if (isCut) {
      ctx.strokeStyle = 'rgba(248,81,73,0.55)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
    } else if (labels) {
      const col = COLORS[labels[e.u] % COLORS.length];
      ctx.strokeStyle = col + '44';
      ctx.lineWidth = 2;
      ctx.setLineDash([]);
    } else {
      ctx.strokeStyle = 'rgba(139,148,158,0.2)';
      ctx.lineWidth = 1;
      ctx.setLineDash([]);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // Cost label
    if (tfm.scale > 18) {
      const mx2 = (pu.x+pv.x)/2, my2 = (pu.y+pv.y)/2;
      ctx.fillStyle = 'rgba(139,148,158,0.5)';
      ctx.font = `${Math.min(10, tfm.scale*0.17)}px IBM Plex Mono`;
      ctx.textAlign = 'center';
      ctx.fillText(e.cost, mx2, my2 - 4);
    }
  }

  // Draw nodes
  const nr = Math.max(7, Math.min(24, tfm.scale * 0.6));
  for (const n of nodes) {
    const p = w2s(n.x, n.y);
    const col = labels ? COLORS[labels[n.id] % COLORS.length] : '#58a6ff';
    const isSeed = seeds.has(n.id);
    const isHov  = hoveredNode && hoveredNode.id === n.id;
    const rr     = isHov ? nr * 1.25 : nr;

    // Region fill glow
    if (labels) {
      const grd = ctx.createRadialGradient(p.x, p.y, rr*0.4, p.x, p.y, rr*3.5);
      grd.addColorStop(0, col + '30');
      grd.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.arc(p.x, p.y, rr*3.5, 0, Math.PI*2);
      ctx.fillStyle = grd;
      ctx.fill();
    }

    // Seed ring indicator
    if (isSeed) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, rr + 4, 0, Math.PI*2);
      ctx.strokeStyle = SEED_RING;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 2]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Node circle
    ctx.beginPath();
    ctx.arc(p.x, p.y, rr, 0, Math.PI*2);
    const grd2 = ctx.createRadialGradient(p.x-rr*0.3, p.y-rr*0.35, 0, p.x, p.y, rr);
    grd2.addColorStop(0, lighten(col, 0.35));
    grd2.addColorStop(1, col);
    ctx.fillStyle = grd2;
    ctx.fill();

    ctx.strokeStyle = isHov ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.2)';
    ctx.lineWidth = isHov ? 2 : 1;
    ctx.stroke();

    // Label
    if (rr > 9) {
      ctx.fillStyle = '#000';
      ctx.font = `600 ${Math.min(rr*0.75, 12)}px IBM Plex Mono`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(n.id, p.x, p.y);
    }
  }
  ctx.textBaseline = 'alphabetic';
}

function lighten(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+a*255)},${Math.min(255,g+a*255)},${Math.min(255,b+a*255)})`;
}

// ─── Run ───────────────────────────────────────────────────────────────────
function showErr(m) {
  const b = document.getElementById('error-box');
  b.textContent = m; b.style.display = 'block';
}
function clearErr() {
  document.getElementById('error-box').style.display = 'none';
}

function runPartition() {
  clearErr();
  const yaml = document.getElementById('yaml-input').value;
  const k    = parseInt(document.getElementById('k-input').value);
  const bal  = parseFloat(document.getElementById('bal-input').value);
  const seed = parseInt(document.getElementById('seed-input').value);

  if (isNaN(k) || k < 2) { showErr('k must be ≥ 2'); return; }
  if (isNaN(bal) || bal < 0) { showErr('Balance strength must be ≥ 0'); return; }

  let parsed;
  try { parsed = parseYAML(yaml); }
  catch(e) { showErr('YAML error: ' + e.message); return; }

  const { nodes, edges } = parsed;
  if (!nodes || nodes.length < 2) { showErr('Need at least 2 nodes'); return; }
  if (k > nodes.length) { showErr(`k=${k} > nodes=${nodes.length}`); return; }

  document.getElementById('run-btn').disabled = true;
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('hud-status').textContent = 'computing…';
  document.getElementById('hud-status').classList.remove('active');

  setTimeout(() => {
    try {
      const rng = makeRng(isNaN(seed) ? 42 : seed);
      const res = regionGrow(nodes, edges || [], k, bal, rng);
      graphData = { nodes, edges: edges || [] };
      result = res;

      // Build adj for connectivity check
      const adj2 = {};
      for (const n of nodes) adj2[n.id] = [];
      for (const e of (edges||[])) {
        adj2[e.u] = adj2[e.u]||[]; adj2[e.v] = adj2[e.v]||[];
        adj2[e.u].push([e.v, e.cost||1]);
        adj2[e.v].push([e.u, e.cost||1]);
      }
      const conn = checkConnected(adj2, res.labels, k);

      fitGraph(nodes);
      draw();

      // Stats
      let cutC = 0;
      const seen = new Set();
      for (const e of (edges||[])) {
        const key = `${Math.min(e.u,e.v)},${Math.max(e.u,e.v)}`;
        if (!seen.has(key)) { seen.add(key); if (res.labels[e.u] !== res.labels[e.v]) cutC += (e.cost||1); }
      }
      document.getElementById('s-nodes').textContent = nodes.length;
      document.getElementById('s-edges').textContent = (edges||[]).length;
      document.getElementById('s-k').textContent = k;
      document.getElementById('s-cut').textContent = cutC.toFixed(1);
      document.getElementById('stats-row').style.display = 'grid';

      // Legend
      const partMap = {};
      for (const [id, p] of Object.entries(res.labels)) {
        partMap[p] = partMap[p] || [];
        partMap[p].push(id);
      }
      const totalSize = nodes.reduce((s,n)=>s+(n.size||1),0);
      const rows = document.getElementById('legend-rows');
      rows.innerHTML = '';
      for (let p = 0; p < k; p++) {
        const ns = partMap[p] || [];
        const sz = ns.reduce((s,id)=>{ const n=nodes.find(x=>x.id==id); return s+(n?.size||1); },0);
        const pct = (sz/totalSize*100).toFixed(0);
        const div = document.createElement('div');
        div.className = 'part-row';
        div.innerHTML = `
          <div class="part-swatch" style="background:${COLORS[p%COLORS.length]}"></div>
          <span class="part-name" style="color:${COLORS[p%COLORS.length]}">P${p}</span>
          <span class="part-nodes">${ns.sort((a,b)=>a-b).join(', ')}</span>
          <span class="part-count">${ns.length}n · ${pct}%</span>
          <span class="part-conn ${conn[p]?'ok':'bad'}">${conn[p]?'✓ conn':'✗ disc'}</span>
        `;
        rows.appendChild(div);
      }
      document.getElementById('legend-wrap').style.display = 'block';

      // Export
      const btns = document.getElementById('export-btns');
      btns.innerHTML = '';
      for (let p = 0; p < k; p++) {
        const b = document.createElement('button');
        b.className = 'btn-dl';
        b.innerHTML = `<span class="swatch" style="background:${COLORS[p%COLORS.length]}"></span>partition_${p}.yaml`;
        b.onclick = () => exportPart(p, nodes, edges||[], res.labels);
        btns.appendChild(b);
      }
      document.getElementById('export-wrap').style.display = 'block';

      const allConn = conn.every(Boolean);
      document.getElementById('hud-status').textContent =
        `partitioned · k=${k} · ${allConn ? 'all connected ✓' : 'check connectivity ⚠'}`;
      document.getElementById('hud-status').className = 'hud-chip' + (allConn ? ' active' : '');

    } catch(err) {
      showErr('Error: ' + err.message);
      document.getElementById('hud-status').textContent = 'error';
    }
    document.getElementById('run-btn').disabled = false;
    document.getElementById('spinner').style.display = 'none';
  }, 50);
}

// ─── Export ──────────────────────────────────────────────────────────────────
function fmtFloat(v) {
  const s = parseFloat(parseFloat(v).toFixed(6));
  return Number.isInteger(s) ? s.toFixed(1) : String(s);
}

function exportPart(p, nodes, edges, labels) {
  const partNodes = nodes
    .filter(n => labels[n.id] === p)
    .sort((a, b) => a.id - b.id);

  const idRemap = {};
  partNodes.forEach((n, i) => { idRemap[n.id] = i + 1; });
  const ids = new Set(partNodes.map(n => n.id));

  let yaml = 'nodes:\n';
  for (const n of partNodes) {
    yaml += `  - id: ${idRemap[n.id]}\n`;
    yaml += `    x: ${fmtFloat(n.x)}\n`;
    yaml += `    y: ${fmtFloat(n.y)}\n`;
    if (n.size && n.size !== 1) yaml += `    size: ${n.size}\n`;
  }

  yaml += 'edges:\n';
  const seen = new Set();
  for (const e of edges) {
    if (ids.has(e.u) && ids.has(e.v)) {
      const key = `${Math.min(e.u,e.v)},${Math.max(e.u,e.v)}`;
      if (!seen.has(key)) {
        seen.add(key);
        yaml += `  - u: ${idRemap[e.u]}\n`;
        yaml += `    v: ${idRemap[e.v]}\n`;
        yaml += `    cost: ${fmtFloat(e.cost || 1.0)}\n`;
      }
    }
  }

  const blob = new Blob([yaml], { type: 'text/yaml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `partition_${p}.yaml`;
  a.click();
}

// ─── Init ──────────────────────────────────────────────────────────────────
window.addEventListener('load', () => { initCanvas(); draw(); });
</script>
